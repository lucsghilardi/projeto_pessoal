file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
; A leitura de comprovante por IA é síncrona e o ReceiptParser usa
; Http::timeout(120) contra a API da Anthropic — 120s aqui não deixaria margem
; para o resto da requisição. Acompanha o fastcgi_read_timeout do nginx.
max_execution_time = 180
max_input_time = 180
max_file_uploads = 20
