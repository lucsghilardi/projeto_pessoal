; Opcache para produção. Em dev o backend/Dockerfile não carrega este arquivo.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; O código não muda dentro do container (imagem imutável), então não há motivo
; para o PHP ficar checando timestamp de arquivo a cada requisição.
opcache.validate_timestamps=0
