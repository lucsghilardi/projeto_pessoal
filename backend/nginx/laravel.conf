# Nginx interno do container `backend`. Não é exposto à internet: só o Next.js
# (via route handlers em app/api/proxy) o alcança, pela rede interna do compose.
# O TLS e a porta 443 são responsabilidade do Nginx do host.

# O token do webhook da Evolution ainda viaja na query string nas instâncias
# assinadas antes do header `X-Webhook-Token` (ver EvolutionService). Sem
# redigir, o segredo é gravado a cada mensagem recebida — e este log entra no
# backup diário. Depois de reassinar todas as instâncias o `map` fica inócuo,
# mas não custa nada mantê-lo.
# `$request_uri` e não `$uri`: depois do try_files o `$uri` já virou
# /index.php, e o log perderia o caminho de verdade.
map $request_uri $request_uri_sem_token {
    ~^(?<antes>.*)token=[^&]*(?<depois>.*)$  "${antes}token=[REDACTED]${depois}";
    default                                  $request_uri;
}

log_format laravel '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $request_uri_sem_token $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /var/www/laravel/public;
    index index.php;

    charset utf-8;

    # DNS embutido do Docker. Com `fastcgi_pass php:9000` literal, o nginx
    # resolve o nome só no boot e guarda o IP para sempre — quando o container
    # php é recriado (o deploy.sh faz isso a cada deploy, para religar o mount
    # do .env) ele ganha um IP novo e o nginx segue batendo no antigo, dando
    # 502 em tudo. Passando por uma variável, a resolução vira por requisição e
    # respeita o `valid=`, então o nginx acompanha a troca de IP sozinho.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upload de comprovantes e de propostas de consórcio — precisa bater com o
    # upload_max_filesize/post_max_size de backend/php/uploads.ini e com o
    # client_max_body_size do vhost do host.
    client_max_body_size 128M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        # Via variável de propósito — ver o comentário do `resolver` acima.
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # A leitura de comprovante por IA chama a API da Anthropic de forma
        # síncrona (ReceiptParser usa Http::timeout(120)); acompanha o
        # max_execution_time de php/uploads.ini.
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/laravel_error.log;
    access_log /var/log/nginx/laravel_access.log laravel;
}
