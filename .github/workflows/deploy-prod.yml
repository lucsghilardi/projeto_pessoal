name: Deploy produção

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys simultâneos disputariam o mesmo diretório no servidor.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # O tsconfig tem strict: true e o next.config não desliga a checagem de
  # tipos — um erro de TS derrubaria o `docker build` no servidor, com o site
  # já no ar. Melhor falhar aqui.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://sistemaraiz.movidoaweb.com.br/api

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Executar deploy no servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/sistemaraiz && ./deploy/deploy.sh'
