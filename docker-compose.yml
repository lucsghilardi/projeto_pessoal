name: projeto_pessoal

services:
  postgres:
    image: postgres:16
    container_name: projeto_pessoal_postgres
    # Lê POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD do .env do Laravel.
    env_file:
      - ./backend/laravel/.env
    ports:
      # Exposto na 5433 no host para não conflitar com outros Postgres na 5432.
      # O backend acessa pela rede interna do compose em postgres:5432.
      - "5433:5432"
    volumes:
      - projeto_pessoal_pgdata:/var/lib/postgresql/data
      # Cria o banco `evolution` (Evolution API) — só roda em volume recém-criado.
      # Em volume existente: docker exec projeto_pessoal_postgres createdb -U projeto_pessoal evolution
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: projeto_pessoal_backend
    working_dir: /var/www/laravel
    # O Laravel lê o arquivo .env montado via volume (sem env_file aqui, para
    # que APP_KEY / JWT_SECRET gerados depois não sejam mascarados pelo ambiente).
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    command: >
      php
      -d upload_max_filesize=128M
      -d post_max_size=128M
      -d memory_limit=512M
      artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/var/www
    ports:
      # 8001 no host (8000 já é usado por outro projeto). Interno continua 8000.
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Worker de filas (módulo WhatsApp: ingest de mídia, relatórios por IA, GTD).
  queue:
    build: ./backend
    container_name: projeto_pessoal_queue
    working_dir: /var/www/laravel
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=600
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scheduler (relatório diário / resumo matinal do WhatsApp).
  scheduler:
    build: ./backend
    container_name: projeto_pessoal_scheduler
    working_dir: /var/www/laravel
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Evolution API v2 — conexão com o WhatsApp (Baileys). O Laravel fala com ela
  # pela rede interna (http://evolution:8080) e ela entrega os webhooks direto
  # no container backend. AUTHENTICATION_API_KEY e DATABASE_CONNECTION_URI vêm
  # do .env do Laravel (mesmo padrão do serviço postgres).
  evolution:
    image: evoapicloud/evolution-api:v2.3.1
    container_name: projeto_pessoal_evolution
    env_file:
      - ./backend/laravel/.env
    environment:
      SERVER_URL: http://evolution:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      # O LOG_LEVEL do Laravel (debug) não é um nível válido para a Evolution.
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # Exposta no host só para depuração (manager em http://localhost:8082/manager).
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: projeto_pessoal_frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
      INTERNAL_API_URL: http://backend:8000/api
    command: sh -c "npm install --include=optional && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      # 3001 no host (3000 já é usado por outro projeto). Interno continua 3000.
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  projeto_pessoal_pgdata:
    name: projeto_pessoal_pgdata
  frontend_node_modules:
    name: projeto_pessoal_frontend_node_modules
  evolution_instances:
    name: projeto_pessoal_evolution_instances
