# Vhost do Nginx do HOST (não é o nginx do container).
# Instalar em /etc/nginx/sites-available/sistemaraiz.movidoaweb.com.br e linkar
# em sites-enabled. Suba assim (só HTTP), rode o certbot, e ele reescreve este
# arquivo adicionando o bloco 443 e o redirect.

server {
    listen 80;
    listen [::]:80;
    server_name sistemaraiz.movidoaweb.com.br;

    # Upload de comprovantes e de propostas de consórcio.
    client_max_body_size 128M;

    # Cabeçalhos de segurança básicos. HSTS fica por conta do certbot.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # 3001 e não 3000: a 3000 é do beef_prod_frontend, no mesmo servidor.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sem isto o Laravel gera URLs em http:// atrás do proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Necessário para streaming/SSE dos Server Components do Next.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # A leitura de comprovante por IA chama a API da Anthropic de forma
        # síncrona e pode passar de 60s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Assets do Next são versionados por hash — cache longo é seguro.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/sistemaraiz_access.log;
    error_log  /var/log/nginx/sistemaraiz_error.log;
}
