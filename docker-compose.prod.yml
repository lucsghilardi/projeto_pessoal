name: sistemaraiz_prod

# Produção. Diferenças essenciais para o docker-compose.yml (dev):
#  - o código vai dentro das imagens (nenhum bind mount de ./backend ou ./frontend)
#  - nada de `artisan serve` nem `npm run dev` — nginx + php-fpm e Next standalone
#  - nenhuma porta publicada, exceto o frontend em 127.0.0.1:3001, que só o
#    Nginx do host alcança. Postgres e Laravel ficam na rede interna.
#    (a 3000 já é do beef_prod_frontend, no mesmo servidor)
#  - storage/ do Laravel em volume nomeado: é onde vivem os comprovantes e as
#    propostas de consórcio enviados pelos usuários.

services:
  postgres:
    image: postgres:16
    container_name: sistemaraiz_prod_postgres
    env_file:
      - ./backend/laravel/.env
    volumes:
      - sistemaraiz_prod_pgdata:/var/lib/postgresql/data
      # Cria o banco `evolution` (Evolution API) — só roda em volume recém-criado.
      # Em volume existente o deploy.sh garante o banco antes das migrações.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: app
    image: sistemaraiz/backend:latest
    container_name: sistemaraiz_prod_php
    working_dir: /var/www/laravel
    volumes:
      - ./backend/laravel/.env:/var/www/laravel/.env:ro
      - sistemaraiz_prod_storage:/var/www/laravel/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: web
    image: sistemaraiz/backend-web:latest
    container_name: sistemaraiz_prod_backend
    depends_on:
      - php
    restart: unless-stopped

  # Worker de filas (módulo WhatsApp). Mesma imagem do php; o deploy.sh também
  # força a recriação dele para religar o mount do .env e recarregar o código.
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: app
    image: sistemaraiz/backend:latest
    container_name: sistemaraiz_prod_queue
    working_dir: /var/www/laravel
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=600
    volumes:
      - ./backend/laravel/.env:/var/www/laravel/.env:ro
      - sistemaraiz_prod_storage:/var/www/laravel/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scheduler (relatório diário / resumo matinal do WhatsApp).
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: app
    image: sistemaraiz/backend:latest
    container_name: sistemaraiz_prod_scheduler
    working_dir: /var/www/laravel
    command: php artisan schedule:work
    volumes:
      - ./backend/laravel/.env:/var/www/laravel/.env:ro
      - sistemaraiz_prod_storage:/var/www/laravel/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Evolution API v2 — conexão com o WhatsApp (Baileys). Só na rede interna:
  # o Laravel a acessa em http://evolution:8080 e ela entrega webhooks no
  # nginx do container backend. Nada é exposto no host (Baileys conecta ao
  # WhatsApp por conexão de saída). AUTHENTICATION_API_KEY e
  # DATABASE_CONNECTION_URI vêm do .env do Laravel.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: sistemaraiz_prod_evolution
    env_file:
      - ./backend/laravel/.env
    environment:
      SERVER_URL: http://evolution:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - sistemaraiz_prod_evolution:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sistemaraiz.movidoaweb.com.br/api
    image: sistemaraiz/frontend:latest
    container_name: sistemaraiz_prod_frontend
    environment:
      # O cookie de sessão só ganha a flag Secure quando NODE_ENV=production
      # (ver frontend/app/api/auth/login/route.ts).
      NODE_ENV: production
      # Resolvido pela rede interna do compose, na porta 80 do nginx do
      # container `backend`; é este que os route handlers do Next usam
      # (ver frontend/lib/auth.ts).
      INTERNAL_API_URL: http://backend/api
      NEXT_PUBLIC_API_URL: https://sistemaraiz.movidoaweb.com.br/api
    ports:
      # Só no loopback — quem expõe à internet é o Nginx do host, com TLS.
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sistemaraiz_prod_pgdata:
    name: sistemaraiz_prod_pgdata
  # Contém storage/app/private/receipts (comprovantes) e
  # storage/app/private/consorcios (propostas em PDF). Perder este volume
  # significa perder todos os anexos, com os registros do banco apontando para
  # arquivos inexistentes.
  sistemaraiz_prod_storage:
    name: sistemaraiz_prod_storage
  # Sessões/credenciais das instâncias da Evolution API. Perder este volume
  # desconecta o WhatsApp e obriga a parear por QR code de novo.
  sistemaraiz_prod_evolution:
    name: sistemaraiz_prod_evolution
